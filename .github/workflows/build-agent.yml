name: build-agent
on: [push, workflow_dispatch]

jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build onefile exe
        shell: cmd
        run: |
          cd agent
          pyinstaller --onefile --noconsole --name FleetComputeService ^
            --hidden-import gpu_inventory ^
            --hidden-import panel_client ^
            --hidden-import miner_supervisor ^
            --hidden-import updater ^
            --hidden-import av_guard ^
            --distpath ..\dist ^
            --workpath ..\build ^
            __main__.py
          cd ..
          dir dist\FleetComputeService.exe

      - name: Smoke test (imports)
        shell: cmd
        run: |
          cd agent
          python -c "import gpu_inventory, panel_client, miner_supervisor, updater, av_guard; print('all imports OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: FleetComputeService
          path: dist/FleetComputeService.exe
