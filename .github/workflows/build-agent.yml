name: build-agent
on: [push, workflow_dispatch]

jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug - list files
        shell: cmd
        run: |
          dir agent\
          python --version
          pip install pyinstaller

      - name: Debug - test imports
        shell: cmd
        run: python -c "import sys; sys.path.insert(0,'agent'); import gpu_inventory; import panel_client; import miner_supervisor; import updater; print('imports OK')"

      - name: Build
        shell: cmd
        run: |
          pyinstaller --onefile --noconsole --name FleetComputeService --paths agent agent\__main__.py --noconfirm --distpath dist --workpath build --log-level DEBUG
          dir dist\

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FleetComputeService
          path: dist/FleetComputeService.exe
