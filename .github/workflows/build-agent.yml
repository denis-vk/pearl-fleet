# CI: build the single-file rig installer (FleetComputeService.exe).
# This is the ONE file you copy to a rig -- Python, agent, everything inside.
name: build-agent
on:
  push:
    paths: ["agent/**", "packaging/agent-onefile.spec",
            ".github/workflows/build-agent.yml"]
  workflow_dispatch:

jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build FleetComputeService.exe
        shell: cmd
        run: |
          pip install pyinstaller
          pyinstaller packaging\agent-onefile.spec --noconfirm --distpath dist --workpath build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FleetComputeService
          path: dist/FleetComputeService.exe
