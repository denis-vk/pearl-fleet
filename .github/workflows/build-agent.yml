name: build-agent
on: [push, workflow_dispatch]

jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Step 1 - verify environment
        shell: powershell
        run: |
          Write-Host "Python: $(python --version)"
          Write-Host "Agent files:"
          Get-ChildItem agent -Name

      - name: Step 2 - install pyinstaller
        run: pip install pyinstaller

      - name: Step 3 - test imports
        shell: python
        run: |
          import sys; sys.path.insert(0, 'agent')
          import gpu_inventory; print("gpu_inventory OK")
          import panel_client;   print("panel_client OK")
          import miner_supervisor; print("miner_supervisor OK")
          import updater;       print("updater OK")
          import av_guard;      print("av_guard OK")
          print("ALL IMPORTS OK")

      - name: Step 4 - build
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\agent"
          pyinstaller --onefile --noconsole --name FleetComputeService `
            --paths agent agent\__main__.py `
            --noconfirm --distpath dist --workpath build
          Get-ChildItem dist

      - name: Step 5 - upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FleetComputeService
          path: dist/FleetComputeService.exe
